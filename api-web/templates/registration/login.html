<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — BiblioDist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --fema-blue: #004784; --fema-orange: #F58220; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fema-blue);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .brand { text-align: center; margin-bottom: 1.75rem; }
    .brand .icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: var(--fema-orange);
      border-radius: 14px;
      font-size: 1.75rem; color: #fff;
      margin-bottom: .75rem;
    }
    .brand h1 { font-size: 1.6rem; font-weight: 700; color: var(--fema-blue); margin: 0; }
    .brand h1 span { color: var(--fema-orange); }
    .brand small { color: #6c757d; font-size: .82rem; }
    .btn-login {
      background: var(--fema-blue); border-color: var(--fema-blue);
      font-weight: 600; font-size: 1rem; padding: .6rem;
    }
    .btn-login:hover { background: #003366; border-color: #003366; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="icon"><i class="bi bi-book-half"></i></div>
    <h1>Biblio<span>Dist</span></h1>
    <small>Sistema de Biblioteca — FEMA</small>
  </div>

  {% if form.errors %}
    <div class="alert alert-danger py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-1"></i>
      Usuário ou senha incorretos.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <label class="form-label fw-semibold">Usuário</label>
      <input type="text" name="username" class="form-control form-control-lg"
             autofocus autocomplete="username" placeholder="nome de usuário">
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Senha</label>
      <input type="password" name="password" class="form-control form-control-lg"
             autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-login btn-primary w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
    </button>
  </form>
</div>
</body>
</html>
