{% extends "base.html" %}
{% block title %}{{ titulo_pag }} — BiblioDist{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h2>{{ titulo_pag }}</h2>
    <div class="card shadow-sm mt-3">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Título *</label>
            <input type="text" name="titulo" class="form-control" value="{{ obj.titulo|default:'' }}" required autofocus>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">ISBN</label>
              <div class="input-group">
                <input type="text" name="isbn" id="id_isbn" class="form-control" value="{{ obj.isbn|default:'' }}">
                <button type="button" class="btn btn-outline-secondary" id="btn_buscar_isbn"
                        title="Buscar dados pelo ISBN">
                  <i class="bi bi-search"></i> Buscar
                </button>
              </div>
              <div id="isbn_status" class="form-text"></div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Ano</label>
              <input type="number" name="ano" class="form-control" value="{{ obj.ano|default:'' }}" min="1000" max="2099">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Exemplares</label>
              <input type="number" name="total_exemplares" class="form-control" value="{{ obj.total_exemplares|default:'1' }}" min="1">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Autor</label>
              <select name="autor" id="id_autor" class="form-select">
                <option value="">— selecione —</option>
                {% for a in autores %}
                  <option value="{{ a.pk }}" {% if obj and obj.autor_id == a.pk %}selected{% endif %}>{{ a.nome }}</option>
                {% endfor %}
              </select>
              <div id="autor_hint" class="form-text"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Categorias</label>
              <select name="categorias" class="form-select" multiple size="6">
                {% for c in categorias %}
                  <option value="{{ c.pk }}" {% if obj and c in obj.categorias.all %}selected{% endif %}>{{ c.nome }}</option>
                {% endfor %}
              </select>
              <div class="form-text">Segure Ctrl para selecionar mais de uma.</div>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Descrição / Resumo</label>
            <textarea name="descricao" id="id_descricao" class="form-control" rows="5"
                      placeholder="Resumo do livro (pode ser preenchido automaticamente pelo ISBN)">{{ obj.descricao|default:'' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'livro_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('btn_buscar_isbn').addEventListener('click', function () {
  const isbn = document.getElementById('id_isbn').value.trim();
  const status = document.getElementById('isbn_status');
  if (!isbn) { status.textContent = 'Informe o ISBN antes de buscar.'; status.style.color = '#dc3545'; return; }

  status.textContent = 'Buscando…';
  status.style.color = '#6c757d';
  this.disabled = true;

  fetch(`{% url 'livro_buscar_isbn' %}?isbn=${encodeURIComponent(isbn)}`)
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { status.textContent = d.erro || 'Nenhum resultado.'; status.style.color = '#dc3545'; return; }

      if (d.titulo)    document.querySelector('[name=titulo]').value = d.titulo;
      if (d.ano)       document.querySelector('[name=ano]').value = d.ano;
      if (d.descricao) document.getElementById('id_descricao').value = d.descricao;

      // Tenta auto-selecionar o autor no dropdown
      const autorHint = document.getElementById('autor_hint');
      autorHint.textContent = '';
      if (d.autores) {
        const sel = document.getElementById('id_autor');
        const apiNome = d.autores.toLowerCase();
        let encontrado = false;
        for (const opt of sel.options) {
          if (opt.text.toLowerCase().includes(apiNome) || apiNome.includes(opt.text.toLowerCase().replace('—', '').trim())) {
            opt.selected = true;
            encontrado = true;
            break;
          }
        }
        if (!encontrado) {
          autorHint.innerHTML = `Autor da API: <strong>${d.autores}</strong> — não cadastrado. <a href="/autores/novo/" target="_blank">Cadastrar agora</a>`;
          autorHint.style.color = '#e67e22';
        }
      }

      const semDesc = !d.descricao ? ' (resumo não disponível nesta API)' : '';
      status.textContent = 'Dados preenchidos' + semDesc + '.';
      status.style.color = '#198754';
    })
    .catch(() => { status.textContent = 'Erro ao conectar.'; status.style.color = '#dc3545'; })
    .finally(() => { document.getElementById('btn_buscar_isbn').disabled = false; });
});
</script>
{% endblock %}
