{% extends "base.html" %}
{% block title %}{{ titulo_pag }} — BiblioDist{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h2>{{ titulo_pag }}</h2>
    <div class="card shadow-sm mt-3">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Título *</label>
            <input type="text" name="titulo" class="form-control" value="{{ obj.titulo|default:'' }}" required autofocus>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">ISBN</label>
              <div class="input-group">
                <input type="text" name="isbn" id="id_isbn" class="form-control" value="{{ obj.isbn|default:'' }}">
                <button type="button" class="btn btn-outline-secondary" id="btn_buscar_isbn"
                        title="Buscar dados pelo ISBN">
                  <i class="bi bi-search"></i> Buscar
                </button>
              </div>
              <div id="isbn_status" class="form-text"></div>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Ano</label>
              <input type="number" name="ano" class="form-control" value="{{ obj.ano|default:'' }}" min="1000" max="2099">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Exemplares</label>
              <input type="number" name="total_exemplares" class="form-control" value="{{ obj.total_exemplares|default:'1' }}" min="1">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Autor</label>
              <select name="autor" id="id_autor" class="form-select">
                <option value="">— selecione —</option>
                {% for a in autores %}
                  <option value="{{ a.pk }}" {% if obj and obj.autor_id == a.pk %}selected{% endif %}>{{ a.nome }}</option>
                {% endfor %}
              </select>
              <div id="autor_hint" class="form-text"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Categorias</label>
              <select name="categorias" class="form-select" multiple size="6">
                {% for c in categorias %}
                  <option value="{{ c.pk }}" {% if obj and c in obj.categorias.all %}selected{% endif %}>{{ c.nome }}</option>
                {% endfor %}
              </select>
              <div class="form-text">Segure Ctrl para selecionar mais de uma.</div>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-3 text-center">
              <div class="border rounded d-flex align-items-center justify-content-center bg-body-tertiary mx-auto"
                   style="width:110px;height:160px;overflow:hidden;">
                <img id="capa_preview" src="{{ obj.capa_url|default:'' }}" alt="Capa do livro"
                     class="{% if not obj.capa_url %}d-none{% endif %}" style="max-width:100%;max-height:100%;"
                     onerror="this.classList.add('d-none');document.getElementById('capa_vazia').classList.remove('d-none');">
                <span id="capa_vazia" class="text-muted small {% if obj.capa_url %}d-none{% endif %}">
                  <i class="bi bi-image fs-3 d-block"></i>Sem capa
                </span>
              </div>
            </div>
            <div class="col-sm-9">
              <div class="row">
                <div class="col-md-7 mb-3">
                  <label class="form-label" for="id_editora">Editora</label>
                  <input type="text" name="editora" id="id_editora" class="form-control" maxlength="200"
                         value="{{ obj.editora|default:'' }}">
                </div>
                <div class="col-md-5 mb-3">
                  <label class="form-label" for="id_data_publicacao">Data de publicação</label>
                  <input type="text" name="data_publicacao" id="id_data_publicacao" class="form-control" maxlength="20"
                         value="{{ obj.data_publicacao|default:'' }}" placeholder="ex.: 14/08/2009">
                </div>
              </div>
              <div class="row">
                <div class="col-md-7 mb-3">
                  <label class="form-label" for="id_capa_url">Capa (URL da imagem)</label>
                  <input type="url" name="capa_url" id="id_capa_url" class="form-control" maxlength="500"
                         value="{{ obj.capa_url|default:'' }}" placeholder="https://…">
                </div>
                <div class="col-md-5 mb-3">
                  <label class="form-label" for="id_nota">Nota (0 a 5)</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-star-fill text-warning"></i></span>
                    <input type="number" name="nota" id="id_nota" class="form-control" min="0" max="5" step="0.01"
                           value="{{ obj.nota|default_if_none:''|stringformat:'s' }}">
                    <input type="number" name="nota_qtd" id="id_nota_qtd" class="form-control" min="0"
                           value="{{ obj.nota_qtd|default_if_none:'' }}" title="Número de avaliações" placeholder="nº aval.">
                  </div>
                </div>
              </div>
            </div>
          </div>
          <fieldset class="border rounded px-3 pt-2 mb-3">
            <legend class="float-none w-auto px-2 fs-6 fw-semibold mb-0">Acervo / Patrimônio</legend>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label" for="id_data_aquisicao">Data de aquisição</label>
                <input type="date" name="data_aquisicao" id="id_data_aquisicao" class="form-control"
                       value="{{ obj.data_aquisicao|date:'Y-m-d' }}">
              </div>
              <div class="col-md-8 mb-3">
                <label class="form-label" for="id_chapa">Grupo/Chapa</label>
                <input type="text" name="chapa" id="id_chapa" class="form-control" maxlength="500"
                       value="{{ obj.chapa|default:'' }}">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="id_tombo_inicial">Tombo inicial</label>
                <input type="text" name="tombo_inicial" id="id_tombo_inicial" class="form-control" maxlength="20"
                       value="{{ obj.tombo_inicial|default:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="id_tombo_exemplar">Tombo exemplar</label>
                <input type="text" name="tombo_exemplar" id="id_tombo_exemplar" class="form-control" maxlength="20"
                       value="{{ obj.tombo_exemplar|default:'' }}">
              </div>
            </div>
          </fieldset>
          <div class="mb-4">
            <label class="form-label">Descrição / Resumo</label>
            <textarea name="descricao" id="id_descricao" class="form-control" rows="5"
                      placeholder="Resumo do livro (pode ser preenchido automaticamente pelo ISBN)">{{ obj.descricao|default:'' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'livro_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function mostrarCapa() {
  const url = document.getElementById('id_capa_url').value.trim();
  const img = document.getElementById('capa_preview');
  const vazia = document.getElementById('capa_vazia');
  if (url) { img.src = url; img.classList.remove('d-none'); vazia.classList.add('d-none'); }
  else { img.removeAttribute('src'); img.classList.add('d-none'); vazia.classList.remove('d-none'); }
}
document.getElementById('id_capa_url').addEventListener('change', mostrarCapa);
// Enter no campo ISBN busca em vez de enviar o formulário
document.getElementById('id_isbn').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn_buscar_isbn').click(); }
});
document.getElementById('btn_buscar_isbn').addEventListener('click', function () {
  const isbn = document.getElementById('id_isbn').value.trim();
  const status = document.getElementById('isbn_status');
  if (!isbn) { status.textContent = 'Informe o ISBN antes de buscar.'; status.style.color = '#dc3545'; return; }

  status.textContent = 'Buscando…';
  status.style.color = '#6c757d';
  this.disabled = true;

  fetch(`{% url 'livro_buscar_isbn' %}?isbn=${encodeURIComponent(isbn)}`)
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { status.textContent = d.erro || 'Nenhum resultado.'; status.style.color = '#dc3545'; return; }

      const set = (sel, v) => { if (v !== null && v !== undefined && v !== '') document.querySelector(sel).value = v; };
      set('[name=titulo]', d.titulo);
      set('[name=ano]', d.ano);
      set('#id_descricao', d.descricao);
      set('#id_editora', d.editora);
      set('#id_data_publicacao', d.data_publicacao);
      set('#id_capa_url', d.capa_url);
      set('#id_nota', d.nota);
      set('#id_nota_qtd', d.nota_qtd);
      mostrarCapa();

      // Tenta auto-selecionar o autor no dropdown
      const autorHint = document.getElementById('autor_hint');
      autorHint.textContent = '';
      if (d.autores) {
        const sel = document.getElementById('id_autor');
        const apiNome = d.autores.toLowerCase();
        let encontrado = false;
        for (const opt of sel.options) {
          if (opt.text.toLowerCase().includes(apiNome) || apiNome.includes(opt.text.toLowerCase().replace('—', '').trim())) {
            opt.selected = true;
            encontrado = true;
            break;
          }
        }
        if (!encontrado) {
          const esc = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          autorHint.innerHTML = `Autor da API: <strong>${esc(d.autores)}</strong> — não cadastrado. <a href="/autores/novo/?nome=${encodeURIComponent(d.autores)}" target="_blank">Cadastrar agora</a>`;
          autorHint.style.color = '#e67e22';
        }
      }

      const faltando = [];
      if (!d.descricao) faltando.push('resumo');
      if (!d.capa_url) faltando.push('capa');
      if (d.nota === null || d.nota === undefined) faltando.push('nota');
      status.textContent = 'Dados preenchidos' + (d.fonte ? ` (fonte: ${d.fonte})` : '') +
        (faltando.length ? ` — sem ${faltando.join(', ')} nas fontes consultadas` : '') + '.';
      status.style.color = '#198754';
      if (d.ja_cadastrados) {
        status.textContent += ` Já existe${d.ja_cadastrados > 1 ? 'm' : ''} ${d.ja_cadastrados} registro${d.ja_cadastrados > 1 ? 's' : ''} com este ISBN no acervo — informe chapa e tombos deste exemplar.`;
      }
      if (d.avisos && d.avisos.length) {
        status.textContent += ' Atenção: ' + d.avisos.join('; ') + '.';
        status.style.color = '#b26a00';
      }
    })
    .catch(() => { status.textContent = 'Erro ao conectar.'; status.style.color = '#dc3545'; })
    .finally(() => { document.getElementById('btn_buscar_isbn').disabled = false; });
});
</script>
{% endblock %}
