{% extends "base.html" %}
{% block title %}Novo Usuário — BiblioDist{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="fema-marker mb-4">Novo Usuário</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome de usuário *</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome completo</label>
            <input type="text" name="primeiro_nome" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Perfil *</label>
            <select name="papel" class="form-select">
              <option value="normal">Consulta (somente leitura)</option>
              <option value="admin">Admin (leitura + edição)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Senha *</label>
            <input type="password" name="senha" class="form-control" minlength="8" required>
            <div class="form-text">Mínimo 8 caracteres.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirmar senha *</label>
            <input type="password" name="senha2" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-person-check me-1"></i>Criar usuário
            </button>
            <a href="{% url 'usuario_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
