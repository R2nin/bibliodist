{% extends "base.html" %}
{% block title %}Resetar Senha — BiblioDist{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="fema-marker mb-4">Resetar Senha</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <p class="text-muted mb-4">
          Definir nova senha para <strong>{{ usuario.username }}</strong>.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nova senha *</label>
            <input type="password" name="senha" class="form-control" minlength="8" required autofocus>
            <div class="form-text">Mínimo 8 caracteres.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirmar nova senha *</label>
            <input type="password" name="senha2" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-key me-1"></i>Redefinir senha
            </button>
            <a href="{% url 'usuario_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
