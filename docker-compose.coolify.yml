services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bibliodist
      POSTGRES_USER: bibliodist
      POSTGRES_PASSWORD: bibliodist
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliodist"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: api-web/Dockerfile
    command: python manage.py migrate --noinput
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: api-web/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_HOST: grpc
      GRPC_PORT: "50051"
      ALLOWED_HOSTS: "computacao.fema.edu.br,localhost"
      DEBUG: "False"
      # Subpath deployment: computacao.fema.edu.br/bibliodist
      SCRIPT_NAME: "/bibliodist"
      STATIC_URL: "/bibliodist/static/"
      CSRF_TRUSTED_ORIGINS: "https://computacao.fema.edu.br"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      # Traefik: roteia computacao.fema.edu.br/bibliodist/* para este serviço.
      # StripPrefix remove /bibliodist antes de passar ao Gunicorn, então
      # o Django recebe PATH_INFO limpo (/livros/, /admin/, etc.).
      # FORCE_SCRIPT_NAME=/bibliodist garante que reverse() e {% url %} incluam
      # /bibliodist/ nos links gerados.
      - "traefik.enable=true"
      # Rede onde o Traefik encontra o container
      - "traefik.docker.network=coolify"
      # Rota HTTPS com prioridade alta (supera catch-all do Coolify)
      - "traefik.http.routers.bibliodist-web.rule=Host(`computacao.fema.edu.br`) && PathPrefix(`/bibliodist`)"
      - "traefik.http.routers.bibliodist-web.entrypoints=websecure"
      - "traefik.http.routers.bibliodist-web.tls=true"
      - "traefik.http.routers.bibliodist-web.middlewares=bibliodist-strip"
      - "traefik.http.routers.bibliodist-web.priority=100"
      - "traefik.http.services.bibliodist-web.loadbalancer.server.port=8000"
      # Middleware: remove /bibliodist do path antes de enviar ao Django
      - "traefik.http.middlewares.bibliodist-strip.stripprefix.prefixes=/bibliodist"

  grpc:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: grpc-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_PORT: "50051"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
