services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bibliodist
      POSTGRES_USER: bibliodist
      POSTGRES_PASSWORD: bibliodist
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliodist"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: api-web/Dockerfile
    command: python manage.py migrate --noinput
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: api-web/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_HOST: grpc
      GRPC_PORT: "50051"
      ALLOWED_HOSTS: "*"
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  grpc:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: grpc-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_PORT: "50051"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: https://github.com/R2nin/bibliodist.git#master
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://bibliodist:bibliodist@db:5432/bibliodist
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
